org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend (WildFly, frontofficeciudadanos-web): dejar descomentada UNA sola linea.
# Nube (Elastic Cloud)
cargauy.baseUrl=https://env-6537388.web.elasticloud.uy/frontofficeciudadanos-web
