org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# API REST del componente central (WildFly, frontofficeciudadanos-web): la app llama a
# BASE_URL/api/movil/*. Local desde el emulador: http://10.0.2.2:8080/frontofficeciudadanos-web
# Se puede cambiar al compilar: ./gradlew assembleDebug -Pcargauy.baseUrl=...
#cargauy.baseUrl=https://env-6537388.web.elasticloud.uy/frontofficeciudadanos-web
cargauy.baseUrl=http://10.0.2.2:8080/frontofficeciudadanos-web
# Redirect URI registrada en ID Uruguay para la app. Mientras AGESIC no registre
# uy.carga.movil:/oauth2redirect se usa el loopback http://localhost:8080 (ReceptorLoopback).

cargauy.oidcRedirect=http://localhost:8080
#cargauy.oidcRedirect=uy.carga.movil:/oauth2redirect
